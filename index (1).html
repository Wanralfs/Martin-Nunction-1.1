<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Nunction</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #525659; /* Standard dark background for PDF viewers */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        object {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback-message {
            text-align: center;
            color: #ffffff;
            padding: 2rem;
            background-color: #333333;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .fallback-message h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .download-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 10px 20px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <!-- The object tag attempts to render the PDF natively in the browser -->
        <object data="Martin Nunction.pdf" type="application/pdf">
            
            <!-- This fallback content only shows if the browser cannot render the PDF -->
            <div class="fallback-message">
                <h2>PDF Viewer Not Available</h2>
                <p>Your browser does not support embedded PDFs.</p>
                <a href="Martin Nunction.pdf" class="download-btn" target="_blank" rel="noopener noreferrer">
                    Download "Martin Matrix Nunction.pdf"
                </a>
            </div>
            
        </object>
    </div>

</body>
</html>
